<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <defs>
    <linearGradient id="fin-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1420"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <linearGradient id="fin-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="200" fill="url(#fin-bg)"/>

  <!-- Title -->
  <text x="32" y="34" font-family="system-ui, sans-serif" font-size="15" fill="#f1f5f9" font-weight="700">Mobile Money &amp; Fintech</text>
  <text x="32" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Adoption · Transaction Value · Financial Inclusion</text>

  <!-- Rising adoption bars -->
  <line x1="32" y1="160" x2="300" y2="160" stroke="#1e293b" stroke-width="1"/>
  <rect x="40"  y="138" width="26" height="22"  rx="2" fill="url(#fin-bar)"/>
  <rect x="80"  y="122" width="26" height="38"  rx="2" fill="url(#fin-bar)"/>
  <rect x="120" y="104" width="26" height="56"  rx="2" fill="url(#fin-bar)"/>
  <rect x="160" y="86"  width="26" height="74"  rx="2" fill="url(#fin-bar)"/>
  <rect x="200" y="70"  width="26" height="90"  rx="2" fill="url(#fin-bar)"/>
  <rect x="240" y="50"  width="26" height="110" rx="2" fill="url(#fin-bar)"/>

  <!-- Growth trend line over the bars -->
  <polyline
    points="53,138 93,122 133,104 173,86 213,70 253,50"
    fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="253" cy="50" r="3.5" fill="#fb923c"/>

  <!-- Year labels -->
  <text x="53"  y="174" font-family="monospace" font-size="8" fill="#334155" text-anchor="middle">'18</text>
  <text x="133" y="174" font-family="monospace" font-size="8" fill="#334155" text-anchor="middle">'21</text>
  <text x="213" y="174" font-family="monospace" font-size="8" fill="#334155" text-anchor="middle">'24</text>

  <!-- Phone with mobile-money transfer -->
  <rect x="360" y="40" width="104" height="140" rx="14" fill="#0f1a10" stroke="#2d6a4f" stroke-width="2"/>
  <rect x="372" y="58" width="80" height="104" rx="6" fill="#0b1118"/>
  <line x1="396" y1="50" x2="428" y2="50" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Currency mark on screen -->
  <circle cx="412" cy="92" r="20" fill="none" stroke="#c2410c" stroke-width="3"/>
  <text x="412" y="100" font-family="system-ui, sans-serif" font-size="22" fill="#fb923c" font-weight="700" text-anchor="middle">$</text>

  <!-- Transfer arrows / send -->
  <path d="M388 130 H436" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M428 122 L438 130 L428 138" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="152" font-family="monospace" font-size="8" fill="#64748b">SENT</text>

  <!-- Signal dots rising from phone -->
  <circle cx="338" cy="72" r="3" fill="#c2410c" opacity="0.8"/>
  <circle cx="330" cy="58" r="2.5" fill="#c2410c" opacity="0.55"/>
  <circle cx="324" cy="46" r="2" fill="#c2410c" opacity="0.35"/>
</svg>
