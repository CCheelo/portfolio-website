<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <defs>
    <linearGradient id="kb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1420"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <linearGradient id="kb-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="200" fill="url(#kb-bg)"/>

  <!-- Title -->
  <text x="32" y="34" font-family="system-ui, sans-serif" font-size="15" fill="#f1f5f9" font-weight="700">Kwacha Books</text>
  <text x="32" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Mobile-money bookkeeping · Cashflow forecast · ZRA invoices</text>

  <!-- Axis -->
  <line x1="32" y1="160" x2="300" y2="160" stroke="#1e293b" stroke-width="1"/>

  <!-- Forecast cone (dashed boundary + fill) over the projected segment -->
  <path d="M196,96 L300,58 L300,118 L196,96 Z" fill="url(#kb-cone)"/>
  <polyline points="196,96 300,58" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <polyline points="196,96 300,118" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Actual cashflow balance line -->
  <polyline
    points="40,140 72,128 104,132 136,112 168,116 196,96"
    fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="196" cy="96" r="3.5" fill="#fb923c"/>
  <!-- Forecast mean (dashed) -->
  <polyline points="196,96 300,88" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>

  <text x="40"  y="174" font-family="monospace" font-size="8" fill="#334155">actual</text>
  <text x="262" y="174" font-family="monospace" font-size="8" fill="#334155">forecast</text>

  <!-- Phone showing a ledger / statement -->
  <rect x="360" y="36" width="104" height="148" rx="14" fill="#0f1a10" stroke="#2d6a4f" stroke-width="2"/>
  <rect x="372" y="54" width="80" height="112" rx="6" fill="#0b1118"/>
  <line x1="396" y1="46" x2="428" y2="46" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Kwacha mark -->
  <circle cx="412" cy="80" r="17" fill="none" stroke="#c2410c" stroke-width="3"/>
  <text x="412" y="88" font-family="monospace" font-size="18" fill="#fb923c" font-weight="700" text-anchor="middle">K</text>

  <!-- Statement rows: income (green) vs expense (orange) -->
  <rect x="382" y="108" width="44" height="5" rx="2.5" fill="#16a34a"/>
  <text x="446" y="113" font-family="monospace" font-size="7" fill="#16a34a" text-anchor="end">in</text>
  <rect x="382" y="122" width="60" height="5" rx="2.5" fill="#c2410c"/>
  <text x="446" y="127" font-family="monospace" font-size="7" fill="#c2410c" text-anchor="end">out</text>
  <rect x="382" y="136" width="32" height="5" rx="2.5" fill="#16a34a"/>
  <rect x="382" y="150" width="50" height="5" rx="2.5" fill="#475569"/>

  <!-- Signal dots -->
  <circle cx="338" cy="70" r="3" fill="#c2410c" opacity="0.8"/>
  <circle cx="330" cy="56" r="2.5" fill="#c2410c" opacity="0.55"/>
  <circle cx="324" cy="44" r="2" fill="#c2410c" opacity="0.35"/>
</svg>
