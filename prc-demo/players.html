<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Registry — Zambezi Futures</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/zf.css" />
</head>
<body data-page="players">
  <div id="navbarContainer"></div>

  <main class="zf-container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2 fade-in-up">
      <div>
        <div class="section-eyebrow">Central Registry</div>
        <h1 class="zf-display fw-bold mb-0" style="font-size:1.6rem;color:var(--zf-dark)">Player Registry</h1>
        <p class="text-muted-zf mb-0 small" id="playerCount"></p>
      </div>
      <a href="register.html" class="btn btn-zf btn-sm px-3">+ Register Player</a>
    </div>

    <!-- Filters -->
    <div class="zf-card p-3 mb-3 fade-in-up" data-delay="1">
      <div class="row g-2">
        <div class="col-sm-12 col-lg-4">
          <input type="search" id="searchInput" class="form-control" placeholder="Search name, PRC ID, position…" />
        </div>
        <div class="col-sm-4 col-lg-3">
          <select id="academyFilter" class="form-select"><option value="">All Academies</option></select>
        </div>
        <div class="col-sm-4 col-lg-2">
          <select id="divisionFilter" class="form-select">
            <option value="">All Divisions</option>
            <option>U-8</option><option>U-10</option><option>U-12</option>
            <option>U-14</option><option>U-16</option><option>U-18</option>
          </select>
        </div>
        <div class="col-sm-4 col-lg-3">
          <select id="statusFilter" class="form-select">
            <option value="">All Statuses</option>
            <option>Active</option><option>Pending</option><option>Rejected</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="zf-card fade-in-up" data-delay="2">
      <div class="table-responsive">
        <table class="zf-table">
          <thead>
            <tr><th>Player</th><th>PRC ID</th><th>Division</th><th>Position</th><th>Academy</th><th>Rating</th><th>Status</th></tr>
          </thead>
          <tbody id="playerTable"></tbody>
        </table>
      </div>
      <div id="emptyMsg" class="text-center py-5" style="display:none;color:var(--zf-muted)">
        <div style="font-size:2rem">⚽</div><div class="fw-medium">No players match your filters.</div>
      </div>
    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var d = PRC_DATA;
      d.academies.forEach(function (a) {
        var opt = document.createElement('option');
        opt.value = a.id; opt.textContent = a.name;
        document.getElementById('academyFilter').appendChild(opt);
      });

      function ratingCell(r) {
        if (!r) return '<span style="color:var(--zf-muted)">—</span>';
        return '<span class="' + (r >= 8 ? 'rating-good' : 'rating-mid') + '">' + r.toFixed(1) + '</span>';
      }

      function render() {
        var search   = document.getElementById('searchInput').value.toLowerCase().trim();
        var academy  = document.getElementById('academyFilter').value;
        var division = document.getElementById('divisionFilter').value;
        var status   = document.getElementById('statusFilter').value;

        var filtered = d.players.filter(function (p) {
          var name = d.fullName(p).toLowerCase(), prcId = p.prcId.toLowerCase(), pos = p.position.toLowerCase();
          if (search && !name.includes(search) && !prcId.includes(search) && !pos.includes(search)) return false;
          if (academy  && String(p.academyId) !== academy) return false;
          if (division && p.division !== division) return false;
          if (status   && p.status !== status) return false;
          return true;
        });

        document.getElementById('playerCount').textContent = filtered.length + ' of ' + d.players.length + ' players';
        var tbody = document.getElementById('playerTable'), empty = document.getElementById('emptyMsg');
        if (!filtered.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
        empty.style.display = 'none';

        tbody.innerHTML = filtered.map(function (p) {
          var acad = d.getAcademy(p.academyId);
          var adminTag = p.role === 'Admin' ? ' <span class="zf-badge badge-admin">Admin</span>' : '';
          return '<tr onclick="location.href=\'player.html?id=' + p.id + '\'">' +
            '<td><div class="d-flex align-items-center gap-2">' + PRC.initialsAvatar(d.fullName(p), 32) +
            '<div><div class="fw-medium">' + d.fullName(p) + adminTag + '</div>' +
            '<div class="small text-muted-zf">' + p.gender + ' · ' + d.age(p.dob) + ' yrs</div></div></div></td>' +
            '<td><span class="prc-id">' + p.prcId + '</span></td>' +
            '<td>' + PRC.divisionBadge(p.division) + '</td>' +
            '<td class="text-nowrap">' + p.position + '</td>' +
            '<td>' + acad.name + '</td>' +
            '<td>' + ratingCell(p.seasonRating) + '</td>' +
            '<td>' + PRC.statusBadge(p.status) + '</td></tr>';
        }).join('');
      }

      ['searchInput','academyFilter','divisionFilter','statusFilter'].forEach(function (id) {
        var el = document.getElementById(id);
        el.addEventListener(id === 'searchInput' ? 'input' : 'change', render);
      });
      render();
    })();
  </script>
</body>
</html>
