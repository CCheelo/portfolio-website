<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Zambezi Futures</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/zf.css" />
</head>
<body data-page="dashboard">
  <div id="navbarContainer"></div>

  <main class="zf-container py-4">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2 fade-in-up">
      <div>
        <div class="section-eyebrow">Season 2025/26 · Fall Intake</div>
        <h1 class="zf-display fw-bold mb-0" style="font-size:1.6rem;color:var(--zf-dark)">Admin Dashboard</h1>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="d-inline-flex align-items-center gap-2 small text-muted-zf">
          <span class="live-dot"></span> Registration window open
        </span>
        <a href="register.html" class="btn btn-zf btn-sm px-3">+ Register Player</a>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="row g-4">
      <!-- Recent enrollments -->
      <div class="col-lg-8 reveal">
        <div class="zf-card">
          <div class="zf-card-header">
            <span>Recent Enrollments</span>
            <a href="players.html" class="fw-semibold text-decoration-none" style="color:var(--zf-gold);text-transform:none;letter-spacing:0">View all →</a>
          </div>
          <div class="table-responsive">
            <table class="zf-table">
              <thead><tr><th>Player</th><th>PRC ID</th><th>Academy</th><th>Division</th><th>Status</th></tr></thead>
              <tbody id="enrollTable"></tbody>
            </table>
          </div>
        </div>

        <!-- Division mix -->
        <div class="zf-card mt-4">
          <div class="zf-card-header">Division Mix · League-wide</div>
          <div class="p-3" id="mixBox"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="col-lg-4">
        <div class="zf-card mb-4 reveal" data-delay="1">
          <div class="zf-card-header">Critical Dates</div>
          <div class="p-3" id="datesBox"></div>
        </div>
        <div class="zf-card reveal" data-delay="2">
          <div class="zf-card-header">Live Activity Feed</div>
          <div class="p-3" id="feedBox"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var d = PRC_DATA;
      var pending = d.players.filter(function (p) { return p.status === 'Pending'; }).length;

      /* Stat cards (with count-up) */
      var stats = [
        { label: 'Total Players',    count: d.stats.totalPlayers, suffix: '', trend: '+12% this term' },
        { label: 'Active Academies', count: d.stats.activeAcademies, suffix: '', trend: 'across 8 regions' },
        { label: 'Active Teams',     count: d.stats.activeTeams, suffix: '', trend: 'league-wide' },
        { label: 'Pending Review',   count: pending, suffix: '', trend: 'awaiting approval' },
      ];
      document.getElementById('statCards').innerHTML = stats.map(function (s, i) {
        return '<div class="col-sm-6 col-xl-3 fade-in-up" data-delay="' + (i % 3) + '">' +
          '<div class="zf-card stat-card hover-lift p-3 h-100">' +
            '<div class="stat-label mb-1">' + s.label + '</div>' +
            '<div class="stat-num"><span data-count="' + s.count + '" data-suffix="' + s.suffix + '">0</span></div>' +
            '<div class="small text-muted-zf mt-1">' + s.trend + '</div>' +
          '</div></div>';
      }).join('');

      /* Recent enrollments */
      var recent = d.players.slice().sort(function (a, b) { return b.registeredDate.localeCompare(a.registeredDate); }).slice(0, 8);
      document.getElementById('enrollTable').innerHTML = recent.map(function (p) {
        var acad = d.getAcademy(p.academyId);
        var adminTag = p.role === 'Admin' ? ' <span class="zf-badge badge-admin">Admin</span>' : '';
        return '<tr onclick="location.href=\'player.html?id=' + p.id + '\'">' +
          '<td><div class="d-flex align-items-center gap-2">' + PRC.initialsAvatar(d.fullName(p), 30) +
          '<span class="fw-medium">' + d.fullName(p) + adminTag + '</span></div></td>' +
          '<td><span class="prc-id">' + p.prcId + '</span></td>' +
          '<td>' + acad.name + '</td>' +
          '<td>' + PRC.divisionBadge(p.division) + '</td>' +
          '<td>' + PRC.statusBadge(p.status) + '</td></tr>';
      }).join('');

      /* Division mix */
      document.getElementById('mixBox').innerHTML = d.divisionMix.map(function (m) {
        return '<div class="mb-3">' +
          '<div class="d-flex justify-content-between small mb-1"><span class="fw-semibold">' + m.division + '</span>' +
          '<span class="text-muted-zf">' + m.pct + '%</span></div>' +
          '<div class="mix-bar"><div class="mix-fill" data-pct="' + m.pct + '" style="width:0"></div></div>' +
        '</div>';
      }).join('');

      /* Critical dates */
      document.getElementById('datesBox').innerHTML = d.criticalDates.map(function (c) {
        return '<div class="feed-item">' +
          '<div class="date-chip"><div class="date-chip__m">' + c.month + '</div><div class="date-chip__d">' + c.day + '</div></div>' +
          '<div><div class="fw-semibold" style="font-size:.9rem">' + c.title + '</div>' +
          '<div class="small text-muted-zf">' + c.sub + '</div></div></div>';
      }).join('');

      /* Feed */
      document.getElementById('feedBox').innerHTML = d.feed.map(function (f) {
        return '<div class="feed-item">' +
          '<div class="feed-icon ' + f.tone + '">' + f.icon + '</div>' +
          '<div><div class="fw-semibold" style="font-size:.88rem">' + f.title + '</div>' +
          '<div class="small text-muted-zf">' + f.detail + '</div></div></div>';
      }).join('');

      /* Re-run count-up + mix fill for dynamically injected nodes */
      if (window.PRC) {
        document.querySelectorAll('#statCards [data-count]').forEach(PRC.animateCount);
      }
      requestAnimationFrame(function () {
        document.querySelectorAll('.mix-fill[data-pct]').forEach(function (b) { b.style.width = b.getAttribute('data-pct') + '%'; });
      });
    })();
  </script>
</body>
</html>
