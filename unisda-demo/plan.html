<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan new work — UNISDA Strategic Planning (demo)</title>
  <meta name="description" content="Plan an activity against the church's strategy in five steps, in the UNISDA Strategic Planning demo. Dummy data only.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/unisda.css">
</head>
<body data-page="plan">
  <main class="page">
    <div class="eyebrow">My department · 2026</div>
    <h1 class="page-title">Plan new work</h1>
    <p class="lede">Planning walks the five levels of the scorecard with the current step marked — because in the old screens nobody could tell what each one was for.</p>
    <div class="wizard-steps" id="steps"></div>
    <div id="stage"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.renderPage = function () {
      var D = window.UNISDA_DATA, U = window.UNISDA, me = U.persona();
      var dept = me.dept || 'yth';
      var pick = { theme: null, objective: null, kpi: null, main: null }, step = 0;
      var LABELS = [['Theme', 'the strategic direction'], ['Objective', 'what the church wants'], ['KPI', 'how it is measured'], ['Main activity', 'the work package'], ['Sub-activity', 'what you deliver']];

      function draw() {
        document.getElementById('steps').innerHTML = LABELS.map(function (l, i) {
          var v = [pick.theme && D.theme(pick.theme).name, pick.objective && D.objective(pick.objective).name, pick.kpi, pick.main][i];
          return '<button class="wstep ' + (i === step ? 'on' : i < step ? 'done' : '') + '" data-go="' + i + '"' + (i > step ? ' disabled' : '') + ' style="text-align:left"><b>' + (i < step ? '✓ ' : (i + 1) + '. ') + l[0] + '</b>' + (v ? String(v).slice(0, 38) : l[1]) + '</button>';
        }).join('');
        var html = '';
        if (me.admin === undefined && !me.dept) html += '<div class="notice"><span>ℹ</span><div>Treasury doesn\'t plan activities — you are planning for <b>' + D.dept(dept).name + '</b> to see how it works.</div></div>';
        if (step === 0) html += '<div class="choices">' + D.themes.map(function (t) {
          var n = D.objectives.filter(function (o) { return o.theme === t.id; }).length;
          return '<button class="choice" data-theme="' + t.id + '"><b>' + t.name + '</b><small>' + n + ' objective' + (n === 1 ? '' : 's') + '</small></button>';
        }).join('') + '</div>';
        if (step === 1) html += '<div class="choices">' + D.objectives.filter(function (o) { return o.theme === pick.theme; }).map(function (o) {
          return '<button class="choice" data-obj="' + o.id + '"><b>' + o.name + '</b></button>';
        }).join('') + '</div>';
        if (step === 2) { var o = D.objective(pick.objective); html += '<div class="choices"><button class="choice" data-kpi="1"><b>' + o.kpi + '</b><small>The KPI agreed for this objective</small></button></div>'; }
        if (step === 3) {
          var mains = {}; D.activities.forEach(function (a) { if (a.objective === pick.objective) mains[a.main] = 1; });
          html += '<div class="choices">' + Object.keys(mains).map(function (m) { return '<button class="choice" data-main="' + m.replace(/"/g, '&quot;') + '"><b>' + m + '</b><small>existing work package</small></button>'; }).join('') +
            '</div><div class="card card__pad" style="margin-top:1rem;max-width:520px"><div class="field"><label for="newMain">Or start a new main activity</label><input id="newMain" placeholder="e.g. Community health outreach"></div><button class="btn btn--teal btn--sm" id="useMain" style="margin-top:.7rem">Use this</button></div>';
        }
        if (step === 4) html += '<form class="card card__pad" id="actForm"><div class="form-grid">' +
          '<div class="field full"><label for="aName">Sub-activity</label><input id="aName" required placeholder="e.g. Youth health screening day"></div>' +
          '<div class="field"><label for="aQ">Timing</label><select id="aQ">' + [1, 2, 3, 4].map(function (q) { return '<option value="' + q + '"' + (q === 4 ? ' selected' : '') + '>' + U.qLabel(q) + '</option>'; }).join('') + '<option value="0">Quarterly (reports four times)</option></select></div>' +
          '<div class="field"><label for="aB">Estimated amount (K)</label><input id="aB" type="number" min="0" step="0.01" required value="5000"><div class="hint" id="ceilingHint"></div></div>' +
          '<div class="field full"><label for="aTag">Tag (optional)</label><select id="aTag"><option value="">None</option><option>Camp Meeting</option><option>Youth Ministries</option></select></div>' +
          '</div><div style="display:flex;gap:.5rem;margin-top:1rem"><button class="btn btn--teal" type="submit">Add to the scorecard</button><button class="btn btn--ghost" type="button" data-go="3">Back</button></div></form>';
        document.getElementById('stage').innerHTML = html;
        var b = document.getElementById('aB');
        if (b) {
          var planned = D.activities.filter(function (a) { return a.dept === dept; }).reduce(function (s, a) { return s + a.budget; }, 0);
          var bud = D.budgets.filter(function (x) { return x.dept === dept; })[0], ceiling = bud.current || Math.ceil(planned * 1.1 / 1000) * 1000;
          var hint = function () { var left = ceiling - planned - (+b.value || 0); document.getElementById('ceilingHint').innerHTML = left >= 0 ? 'K' + D.fmt(left) + ' left in this year\'s approved budget of K' + D.fmt(ceiling) + '.' : '<span class="flag">K' + D.fmt(-left) + ' over this year\'s approved budget — flagged for the committee, not blocked.</span>'; };
          b.addEventListener('input', hint); hint();
        }
      }

      document.getElementById('stage').addEventListener('click', function (e) {
        var t = e.target.closest('[data-theme]'), o = e.target.closest('[data-obj]'), k = e.target.closest('[data-kpi]'), m = e.target.closest('[data-main]');
        if (t) { pick.theme = t.getAttribute('data-theme'); step = 1; }
        else if (o) { pick.objective = o.getAttribute('data-obj'); step = 2; }
        else if (k) { pick.kpi = D.objective(pick.objective).kpi; step = 3; }
        else if (m) { pick.main = m.getAttribute('data-main'); step = 4; }
        else if (e.target.id === 'useMain') { var v = document.getElementById('newMain').value.trim(); if (!v) { U.toast('Give the work package a name first.'); return; } pick.main = v; step = 4; }
        else if (e.target.closest('[data-go]')) { step = +e.target.closest('[data-go]').getAttribute('data-go'); }
        else return;
        draw();
      });
      document.getElementById('steps').addEventListener('click', function (e) { var g = e.target.closest('[data-go]'); if (g && !g.disabled) { step = +g.getAttribute('data-go'); draw(); } });
      document.getElementById('stage').addEventListener('submit', function (e) {
        e.preventDefault();
        var q = +document.getElementById('aQ').value, id = Math.max.apply(null, D.activities.map(function (a) { return a.id; })) + 1;
        D.activities.push({ id: id, dept: dept, objective: pick.objective, main: pick.main, name: document.getElementById('aName').value.trim(), quarter: q || D.currentQuarter, budget: +document.getElementById('aB').value || 0, spent: 0, band: null, movedFrom: null, tag: document.getElementById('aTag').value || null });
        D.save();
        location.href = 'scorecard.html?dept=' + dept + '#row-' + id;
      });
      draw();
    };
  </script>
</body>
</html>
