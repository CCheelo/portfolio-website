<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment requests — UNISDA Strategic Planning (demo)</title>
  <meta name="description" content="Payment requests, the four-stage signing chain and the monthly committee sitting, in the UNISDA demo. Dummy data only.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/unisda.css">
</head>
<body data-page="requests">
  <main class="page">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap">
      <div>
        <div class="eyebrow">Money · 2026</div>
        <h1 class="page-title">Payment requests</h1>
        <p class="lede">The paper Payment Request form, with its four signatures, and the monthly Stewardship &amp; Finance sitting that works the requests as one batch.</p>
      </div>
      <button class="btn btn--teal" id="newReq">+ New request</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="mine" aria-selected="true">Requests <span class="count" id="cMine"></span></button>
      <button class="tab" role="tab" data-tab="sitting" aria-selected="false">October sitting <span class="count" id="cSit"></span></button>
      <button class="tab" role="tab" data-tab="paid" aria-selected="false">Paid &amp; receipts <span class="count" id="cPaid"></span></button>
    </div>

    <div id="panel"></div>
  </main>

  <dialog class="modal" id="newModal" aria-labelledby="nmTitle">
    <form method="dialog" id="newForm">
      <div class="modal__head"><div class="eyebrow">New payment request</div><h3 id="nmTitle">Request funds against the plan</h3></div>
      <div class="modal__body">
        <div class="field"><label for="nmAct">Planned activity</label><select id="nmAct"></select></div>
        <div class="field"><label for="nmAmt">Amount (K)</label><input id="nmAmt" type="number" min="1" step="0.01" required><div class="hint" id="nmHint"></div></div>
        <div class="field"><label for="nmDate">Money needed by</label><input id="nmDate" type="date" value="2026-10-08" required><div class="hint" id="nmDateHint"></div></div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" id="nmCancel">Cancel</button>
        <button type="submit" class="btn btn--teal">Submit for signing</button>
      </div>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.renderPage = function () {
      var D = window.UNISDA_DATA, U = window.UNISDA, me = U.persona();
      var tab = 'mine';
      var decisions = D.decisions;   // key "reqId:lineIdx" → { kind, amount }; saved with the demo state

      function deptName(id) { return D.dept(id).name; }
      function chain(stage) {
        return '<div class="chain">' + D.stages.map(function (s, i) {
          var cls = i < stage ? 'done' : i === stage ? 'now' : '';
          var note = i < stage ? 'Signed' : i === stage ? 'Waiting' : '—';
          return '<div class="chain__step ' + cls + '"><b>' + s + '</b>' + note + '</div>';
        }).join('') + '</div>';
      }
      function total(r) { return r.lines.reduce(function (s, l) { return s + l.amount; }, 0); }
      function lineFlags(l, r) {
        var f = '';
        if (l.amount > l.remaining) f += '<span class="flag">Over the planned figure by K' + D.fmt(l.amount - l.remaining) + '</span> ';
        if (r.neededBy < '2026-10-31' && r.stage < 3) f += '<span class="flag" style="color:var(--gold-700);background:var(--gold-100)">Needed this month</span>';
        return f;
      }

      function mine() {
        var list = D.requests.filter(function (r) { return !me.dept || r.dept === me.dept; });
        if (!list.length) return '<div class="card card__pad">No requests yet.</div>';
        return list.map(function (r) {
          return '<article class="card req reveal is-visible"><div class="req__head"><div><div class="req__title">' + r.id + ' · ' + deptName(r.dept) + (r.trust ? ' <span class="pill pill--gold">Trust fund</span>' : '') + '</div>' +
            '<div class="req__meta">Raised by ' + r.by + ' on ' + U.dateParts(r.raised).full + ' · needed by ' + U.dateParts(r.neededBy).full + '</div></div>' +
            '<div class="line__amt num">K' + D.fmt(total(r)) + '</div></div>' + chain(r.stage) + signAction(r) +
            r.lines.map(function (l) {
              return '<div class="line" style="grid-template-columns:2fr 1fr 1fr"><div><div class="line__name">' + l.act + '</div>' + lineFlags(l, r) + '</div>' +
                '<div class="line__ctx">Scorecard figure<br><b class="num" style="color:var(--ink)">K' + D.fmt(l.planned) + '</b></div>' +
                '<div class="line__ctx">Requested<br><b class="num" style="color:var(--ink)">K' + D.fmt(l.amount) + '</b></div></div>';
            }).join('') + '</article>';
        }).join('');
      }

      /* Who can move a request along the chain, as the persona currently selected */
      function signAction(r) {
        if (r.stage === 0 && me.dept === r.dept) return '<button class="btn btn--teal btn--sm" data-sign="' + r.id + '">✍ Sign as department leader</button>';
        if (r.stage === 0) return '<p class="req__meta">Waiting on ' + D.dept(r.dept).leader + ' (department leader) to sign.</p>';
        if (r.stage === 1) return '<button class="btn btn--ghost btn--sm" data-sign="' + r.id + '">Simulate ' + D.dept(r.dept).elder + ' (elder in charge) signing</button>';
        if (r.stage === 2) return '<p class="req__meta">In the queue for the October sitting.</p>';
        return '';
      }

      function sitting() {
        var queue = D.requests.filter(function (r) { return r.stage === 2; });
        var canDecide = me.finance;
        var n = 0, decided = 0, approved = 0;
        queue.forEach(function (r) { r.lines.forEach(function (l, i) {
          n++; var d = decisions[r.id + ':' + i];
          if (d) { decided++; if (d.kind !== 'decline') approved += d.amount; }
        }); });

        var head = '<div class="notice"><span aria-hidden="true">⚖</span><div><strong>Sitting of 13 October 2026.</strong> The submission window closed on 10 October; the queue is worked as one batch. ' +
          'Each line shows its scorecard figure and what the department has left — <em>shown, never enforced</em>. ' +
          (canDecide ? 'You chair the sitting: decide each line.' : 'Only the committee decides here — switch to <b>Esther Mwansa (Treasury)</b> at the top right to work the queue.') + '</div></div>' +
          '<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:1.25rem">' +
          '<div class="stat"><div class="stat__label">Lines in the queue</div><div class="stat__value num">' + n + '</div><div class="stat__note">' + queue.length + ' requests</div></div>' +
          '<div class="stat stat--gold"><div class="stat__label">Decided</div><div class="stat__value num">' + decided + '<small style="font-size:1rem">/' + n + '</small></div><div class="stat__note">Vary is resolved in the same sitting</div></div>' +
          '<div class="stat stat--green"><div class="stat__label">Approved</div><div class="stat__value num"><small>K</small>' + D.fmt(approved) + '</div><div class="stat__note">Released by Treasury after the sitting</div></div></div>' +
          (canDecide && decided ? '<button class="btn btn--teal" id="release" style="margin-bottom:1.25rem">Close the sitting and release K' + D.fmt(approved) + '</button>' : '');

        return head + queue.map(function (r) {
          return '<article class="card req"><div class="req__head"><div><div class="req__title">' + deptName(r.dept) + (r.trust ? ' <span class="pill pill--gold">Trust fund — the department\'s own money</span>' : '') + '</div>' +
            '<div class="req__meta">' + r.id + ' · needed by ' + U.dateParts(r.neededBy).full + '</div></div></div>' +
            r.lines.map(function (l, i) {
              var key = r.id + ':' + i, d = decisions[key], right;
              if (d) {
                var words = { approve: 'Approved', reduce: 'Approved at a reduced K' + D.fmt(d.amount), vary: 'Varied to K' + D.fmt(d.amount) + ' — resolved', decline: 'Declined' };
                right = '<div class="decision ' + d.kind + '">' + words[d.kind] + (canDecide ? ' · <button class="undo" data-undo="' + key + '" style="color:var(--teal-700);font-weight:700">undo</button>' : '') + '</div>';
              } else if (canDecide) {
                right = '<div class="decide" data-key="' + key + '" data-amt="' + l.amount + '">' +
                  '<button class="ok" data-d="approve">Approve</button><button data-d="reduce">Reduce</button>' +
                  '<button data-d="vary">Vary</button>' + (r.trust ? '' : '<button class="no" data-d="decline">Decline</button>') + '</div>';
              } else right = '<div class="decision" style="color:var(--muted)">Awaiting the sitting</div>';
              return '<div class="line"><div><div class="line__name">' + l.act + '</div>' + lineFlags(l, r) + '</div>' +
                '<div class="line__ctx">Scorecard<br><b class="num" style="color:var(--ink)">K' + D.fmt(l.planned) + '</b></div>' +
                '<div class="line__ctx">Left in budget<br><b class="num" style="color:var(--ink)">K' + D.fmt(l.remaining) + '</b></div>' +
                '<div><div class="line__amt num" style="text-align:right">K' + D.fmt(l.amount) + '</div>' + right + '</div></div>';
            }).join('') + '</article>';
        }).join('');
      }

      function paid() {
        var list = D.disbursed.filter(function (p) { return !me.dept || p.dept === me.dept; });
        var owed = list.filter(function (p) { return !p.receipt; }).length;
        return '<div class="notice"><span aria-hidden="true">🧾</span><div><strong>' + owed + ' receipt' + (owed === 1 ? '' : 's') + ' still owed.</strong> Outstanding receipts are visible and chased — never blocking. <em>"This is still church after all, we can\'t be business strict."</em></div></div>' +
          '<div class="card table-wrap"><table class="sc" style="min-width:620px"><thead><tr><th>Request</th><th>Department</th><th>Activity</th><th style="text-align:right">Paid</th><th>Date</th><th>Receipt</th></tr></thead><tbody>' +
          list.map(function (p) {
            var days = Math.round((new Date('2026-10-04') - new Date(p.paid)) / 864e5);
            return '<tr><td>' + p.id + '</td><td>' + deptName(p.dept) + '</td><td>' + p.act + '</td><td class="money num">' + D.fmt(p.amount) + '</td><td>' + U.dateParts(p.paid).full + '</td>' +
              '<td>' + (p.receipt ? '<span class="status status--done">Retired</span>' + (p.file ? '<br><small style="color:var(--muted)">' + p.file.replace(/</g, '&lt;') + '</small>' : '')
                : '<span class="status status--prog">Owed · ' + days + ' days</span><br><label class="btn btn--ghost btn--sm" style="margin-top:.35rem;cursor:pointer">Attach receipt<input type="file" accept="image/*,.pdf" data-receipt="' + p.id + '" hidden></label>') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }

      function draw() {
        document.getElementById('cMine').textContent = D.requests.filter(function (r) { return !me.dept || r.dept === me.dept; }).length;
        document.getElementById('cSit').textContent = D.requests.filter(function (r) { return r.stage === 2; }).length;
        document.getElementById('cPaid').textContent = D.disbursed.filter(function (p) { return !me.dept || p.dept === me.dept; }).length;
        document.getElementById('panel').innerHTML = tab === 'mine' ? mine() : tab === 'sitting' ? sitting() : paid();
      }

      document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () {
          tab = t.getAttribute('data-tab');
          document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x === t); x.setAttribute('aria-selected', x === t ? 'true' : 'false'); });
          draw();
        });
      });

      document.getElementById('panel').addEventListener('change', function (e) {
        var inp = e.target.closest('[data-receipt]'); if (!inp || !inp.files.length) return;
        var p = D.disbursed.filter(function (x) { return x.id === inp.getAttribute('data-receipt'); })[0];
        p.receipt = true; p.file = inp.files[0].name + ' (stays on your device)'; D.save(); draw();
        U.toast('Receipt attached — the request is retired.');
      });
      document.getElementById('panel').addEventListener('click', function (e) {
        var sign = e.target.closest('[data-sign]');
        if (sign) {
          var r = D.requests.filter(function (x) { return x.id === sign.getAttribute('data-sign'); })[0];
          r.stage++; D.save(); draw();
          U.toast(r.stage === 2 ? 'Both signatures in — it joins the queue for the monthly sitting.' : 'Signed. Next: the elder in charge.');
          return;
        }
        if (e.target.id === 'release') {
          var released = 0;
          D.requests.filter(function (r) { return r.stage === 2; }).forEach(function (r) {
            var all = r.lines.every(function (l, i) { return decisions[r.id + ':' + i]; });
            if (!all) return;
            r.lines.forEach(function (l, i) {
              var d = decisions[r.id + ':' + i];
              if (d.kind !== 'decline') { D.disbursed.unshift({ id: r.id, dept: r.dept, act: l.act, amount: d.amount, paid: '2026-10-14', receipt: false }); released += d.amount; }
              delete decisions[r.id + ':' + i];
            });
            r.stage = 4;
          });
          D.requests = D.requests.filter(function (r) { return r.stage < 4; });
          D.save(); draw();
          U.toast(released ? 'Released K' + D.fmt(released) + '. Receipts are now owed — see Paid & receipts.' : 'Decide every line of a request before releasing it.');
          return;
        }
        var undo = e.target.closest('[data-undo]');
        if (undo) { delete decisions[undo.getAttribute('data-undo')]; D.save(); draw(); return; }
        var b = e.target.closest('[data-d]'); if (!b) return;
        var box = b.parentElement, key = box.getAttribute('data-key'), amt = +box.getAttribute('data-amt');
        var kind = b.getAttribute('data-d'), value = amt;
        if (kind === 'reduce' || kind === 'vary') {
          var ans = window.prompt(kind === 'reduce' ? 'Approve at what amount? (K)' : 'Revise the line to what amount? (K)', Math.round(amt * 0.85));
          if (ans === null) return;
          value = Math.max(0, parseFloat(ans) || 0);
        }
        decisions[key] = { kind: kind, amount: kind === 'decline' ? 0 : value };
        D.save(); draw();
      });

      /* ───── New request ───── */
      var modal = document.getElementById('newModal');
      var deptForNew = me.dept || 'yth';
      var planned = D.activities.filter(function (a) { return a.dept === deptForNew && a.band == null; });
      var actSel = document.getElementById('nmAct');
      actSel.innerHTML = planned.map(function (a) { return '<option value="' + a.id + '">' + a.name + ' — K' + D.fmt(a.budget) + ' planned</option>'; }).join('');
      var amt = document.getElementById('nmAmt'), date = document.getElementById('nmDate');
      function hints() {
        var a = planned.filter(function (x) { return x.id === +actSel.value; })[0];
        var v = +amt.value || 0;
        document.getElementById('nmHint').innerHTML = a && v > a.budget
          ? '<span class="flag">Over the scorecard figure by K' + D.fmt(v - a.budget) + ' — flagged for the committee, not blocked.</span>'
          : 'Within the scorecard figure.';
        document.getElementById('nmDateHint').innerHTML = date.value && date.value < '2026-10-31'
          ? '<span class="flag" style="color:var(--gold-700);background:var(--gold-100)">Needed inside the submission month — it may miss this sitting.</span>' : '';
      }
      [actSel, amt, date].forEach(function (el) { el.addEventListener('input', hints); });
      document.getElementById('newReq').addEventListener('click', function () {
        if (!me.dept && !me.admin) { U.toast('Treasury releases money rather than requesting it — switch to the Youth leader to try this.'); return; }
        amt.value = planned[0] ? planned[0].budget : 1000; hints(); modal.showModal();
      });
      document.getElementById('nmCancel').addEventListener('click', function () { modal.close(); });
      document.getElementById('newForm').addEventListener('submit', function () {
        var a = planned.filter(function (x) { return x.id === +actSel.value; })[0];
        D.requests.unshift({ id: 'PR-2026-' + (131 + Math.floor(Math.random() * 50)), dept: deptForNew, by: me.name, raised: '2026-10-04', neededBy: date.value, stage: 0,
          lines: [{ act: a.name, amount: +amt.value, planned: a.budget, remaining: a.budget }] });
        D.save();
        tab = 'mine';
        document.querySelector('[data-tab="mine"]').click();
        U.toast('Submitted — it now waits for the department leader\'s signature.');
      });

      draw();
    };
  </script>
</body>
</html>
